[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[supervisord]
logfile=/tmp/supervisord.log
logfile_maxbytes=5MB
logfile_backups=0
loglevel=info
pidfile=/tmp/supervisord.pid
childlogdir=/tmp
nodaemon=true
user=root

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[include]
files = /etc/supervisor/conf.d/*.conf

# ── D-Bus system bus (needs root) ──
[program:dbus]
command=bash -c "mkdir -pm700 '%(ENV_XDG_RUNTIME_DIR)s' && chown -f '%(ENV_USER)s:%(ENV_USER)s' '%(ENV_XDG_RUNTIME_DIR)s' && chmod -f 700 '%(ENV_XDG_RUNTIME_DIR)s' && dbus-daemon --system --nofork --nosyslog --nopidfile --address='%(ENV_DBUS_SYSTEM_BUS_ADDRESS)s'"
environment=DISPLAY="%(ENV_DISPLAY)s",XDG_RUNTIME_DIR="%(ENV_XDG_RUNTIME_DIR)s",DBUS_SYSTEM_BUS_ADDRESS="%(ENV_DBUS_SYSTEM_BUS_ADDRESS)s",USER="%(ENV_USER)s",HOME="%(ENV_HOME)s"
stdout_logfile=/tmp/dbus.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=0
redirect_stderr=true
stopasgroup=true
stopsignal=INT
autostart=true
autorestart=true
priority=1

# ── Entry script (Xvfb + desktop + NVIDIA runtime driver install, needs root for Xvfb+driver) ──
[program:entrypoint]
command=bash -c "dbus-run-session -- /etc/entrypoint.sh"
environment=DISPLAY="%(ENV_DISPLAY)s",XDG_RUNTIME_DIR="%(ENV_XDG_RUNTIME_DIR)s",DBUS_SYSTEM_BUS_ADDRESS="%(ENV_DBUS_SYSTEM_BUS_ADDRESS)s",USER="%(ENV_USER)s",HOME="%(ENV_HOME)s",PASSWD="%(ENV_PASSWD)s",TZ="%(ENV_TZ)s",DISPLAY_SIZEW="%(ENV_DISPLAY_SIZEW)s",DISPLAY_SIZEH="%(ENV_DISPLAY_SIZEH)s",DISPLAY_REFRESH="%(ENV_DISPLAY_REFRESH)s",DISPLAY_DPI="%(ENV_DISPLAY_DPI)s",DISPLAY_CDEPTH="%(ENV_DISPLAY_CDEPTH)s",VGL_DISPLAY="%(ENV_VGL_DISPLAY)s",LD_LIBRARY_PATH="%(ENV_LD_LIBRARY_PATH)s",PIPEWIRE_LATENCY="%(ENV_PIPEWIRE_LATENCY)s",PULSE_SERVER="%(ENV_PULSE_SERVER)s",PULSE_RUNTIME_PATH="%(ENV_PULSE_RUNTIME_PATH)s",GTK_IM_MODULE="%(ENV_GTK_IM_MODULE)s",QT_IM_MODULE="%(ENV_QT_IM_MODULE)s",XMODIFIERS="%(ENV_XMODIFIERS)s"
stdout_logfile=/tmp/entrypoint.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=0
redirect_stderr=true
stopasgroup=true
stopsignal=INT
autostart=true
autorestart=true
priority=1

# ── PipeWire audio group (runs as evdi user) ──
[group:pipewire-group]
program=pipewire,wireplumber,pipewire-pulse
priority=10

[program:pipewire]
command=bash -c 'DISP_NUM="${DISPLAY#*:}"; until [ -S "/tmp/.X11-unix/X${DISP_NUM}" ]; do sleep 0.5; done; dbus-run-session -- /usr/bin/pipewire'
user=%(ENV_USER)s
environment=PIPEWIRE_LATENCY="128/48000",DISPLAY="%(ENV_DISPLAY)s",DISABLE_RTKIT="y",XDG_RUNTIME_DIR="%(ENV_XDG_RUNTIME_DIR)s",DBUS_SYSTEM_BUS_ADDRESS="%(ENV_DBUS_SYSTEM_BUS_ADDRESS)s",PIPEWIRE_RUNTIME_DIR="%(ENV_XDG_RUNTIME_DIR)s",PULSE_RUNTIME_PATH="%(ENV_XDG_RUNTIME_DIR)s/pulse",HOME="%(ENV_HOME)s",USER="%(ENV_USER)s"
stdout_logfile=/tmp/pipewire.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=0
redirect_stderr=true
stopasgroup=true
stopsignal=INT
autostart=true
autorestart=true

[program:wireplumber]
command=bash -c 'until [ "$(echo ${XDG_RUNTIME_DIR}/pipewire-*.lock)" != "${XDG_RUNTIME_DIR}/pipewire-*.lock" ]; do sleep 0.5; done; dbus-run-session -- /usr/bin/wireplumber'
user=%(ENV_USER)s
environment=PIPEWIRE_LATENCY="128/48000",DISPLAY="%(ENV_DISPLAY)s",DISABLE_RTKIT="y",XDG_RUNTIME_DIR="%(ENV_XDG_RUNTIME_DIR)s",DBUS_SYSTEM_BUS_ADDRESS="%(ENV_DBUS_SYSTEM_BUS_ADDRESS)s",PIPEWIRE_RUNTIME_DIR="%(ENV_XDG_RUNTIME_DIR)s",PULSE_RUNTIME_PATH="%(ENV_XDG_RUNTIME_DIR)s/pulse",HOME="%(ENV_HOME)s",USER="%(ENV_USER)s"
stdout_logfile=/tmp/wireplumber.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=0
redirect_stderr=true
stopasgroup=true
stopsignal=INT
autostart=true
autorestart=true

[program:pipewire-pulse]
command=bash -c 'until [ "$(echo ${XDG_RUNTIME_DIR}/pipewire-*.lock)" != "${XDG_RUNTIME_DIR}/pipewire-*.lock" ]; do sleep 0.5; done; dbus-run-session -- /usr/bin/pipewire-pulse'
user=%(ENV_USER)s
environment=PIPEWIRE_LATENCY="128/48000",DISPLAY="%(ENV_DISPLAY)s",DISABLE_RTKIT="y",XDG_RUNTIME_DIR="%(ENV_XDG_RUNTIME_DIR)s",DBUS_SYSTEM_BUS_ADDRESS="%(ENV_DBUS_SYSTEM_BUS_ADDRESS)s",PIPEWIRE_RUNTIME_DIR="%(ENV_XDG_RUNTIME_DIR)s",PULSE_RUNTIME_PATH="%(ENV_XDG_RUNTIME_DIR)s/pulse",HOME="%(ENV_HOME)s",USER="%(ENV_USER)s"
stdout_logfile=/tmp/pipewire-pulse.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=0
redirect_stderr=true
stopasgroup=true
stopsignal=INT
autostart=true
autorestart=true

# ── EVDI Agent (runs as evdi user) ──
[program:agent]
command=bash -c 'DISP_NUM="${DISPLAY#*:}"; until [ -S "/tmp/.X11-unix/X${DISP_NUM}" ]; do sleep 0.5; done; exec /usr/local/bin/agent'
user=%(ENV_USER)s
environment=DISPLAY="%(ENV_DISPLAY)s",XDG_RUNTIME_DIR="%(ENV_XDG_RUNTIME_DIR)s",DBUS_SYSTEM_BUS_ADDRESS="%(ENV_DBUS_SYSTEM_BUS_ADDRESS)s",HOME="%(ENV_HOME)s",USER="%(ENV_USER)s"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
stopasgroup=true
stopsignal=INT
autostart=true
autorestart=true
priority=50
